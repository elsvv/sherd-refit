<head>

<style>
:root{--bg:#1b1c1f;--panel:#232529;--panel2:#2c2f34;--text:#e9e6e1;--muted:#9ba0a8;--line:#3a3e45;--accent:#f2a54a;--ok:#74c98f;--warn:#e3c35e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{display:flex;height:100%}
#side{width:330px;min-width:240px;max-width:45vw;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#side header{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
#side h1{font-size:15px;margin:0 0 3px;font-weight:600;word-break:break-all}
#summary{color:var(--muted);font-size:12px}
#search{margin:10px 14px 8px;padding:6px 9px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}
#tools{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;border-bottom:1px solid var(--line)}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:#4b3b27;border-color:var(--accent)}
#lists{flex:1;overflow:auto;padding:4px 0 10px}
.group{padding:2px 14px}
.ghead{display:flex;align-items:center;gap:7px;margin-top:8px}
.ghead input{margin:0}
.ghead .gname{flex:1;font-weight:600;cursor:pointer;user-select:none}
.ghead .gname:hover{color:var(--accent)}
.ghead button{padding:1px 7px;font-size:11px}
.frag{padding:2px 6px 2px 24px;border-radius:4px;cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frag:hover{background:var(--panel2)}
.frag.sel{background:#4b3b27}
.frag.gone{display:none}
.frag.off{opacity:.45}
.sw{width:10px;height:10px;border-radius:2px;flex:none;background:transparent}
#details{border-top:1px solid var(--line);padding:10px 14px;max-height:45%;overflow:auto;display:none}
#details h2{font-size:17px;margin:0 0 4px;word-break:break-all}
.muted{color:var(--muted)}
#details table{border-collapse:collapse;width:100%;margin-top:8px;font-size:12px}
#details th{color:var(--muted);font-weight:400;text-align:left;padding:2px 4px}
#details td{padding:3px 4px;border-top:1px solid var(--line);white-space:nowrap}
#details td.name{max-width:150px;overflow:hidden;text-overflow:ellipsis}
#details a{color:var(--accent);text-decoration:none;cursor:pointer}
#details a:hover{text-decoration:underline}
.band-confirmed{color:var(--ok)}
.band-probable,.band-accepted{color:var(--warn)}
#help{padding:8px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
#view{flex:1;position:relative;overflow:hidden}
canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none;outline:none}
canvas.drag{cursor:grabbing}
#tip{position:absolute;pointer-events:none;background:rgba(18,18,20,.94);border:1px solid var(--line);padding:6px 10px;border-radius:7px;display:none;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:3}
#tip b{font-size:18px;color:#fff;display:block;letter-spacing:.2px}
#tip span{color:var(--muted);font-size:12px}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
#labels div{position:absolute;transform:translate(-50%,-50%);background:rgba(0,0,0,.66);color:#fff;padding:1px 6px;border-radius:4px;font-size:11px;white-space:nowrap;display:none}
#labels div.sel{background:var(--accent);color:#111}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:40px;text-align:center;color:var(--muted);font-size:15px}
</style>

"use strict";

  const bandName = { confirmed: "подтверждён", probable: "вероятный", accepted: "принят" };

  const rows = new Map();
  const isVisible = (f) => {
    const fr = F[f];

  // ---------- side panel ----------
  function buildLists() {
    const lists = $("lists");
    for (const g of asmGroups) addGroup(`Группа ${g.index}`, g.members, [g.index], false);

    function addGroup(title, members, indices, collapsed) {

layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNor; layout(location=2) in vec4 aCol;
uniform mat4 uModel, uView, uProj;
out vec3 vNor; out vec3 vCol; out vec3 vPos;

      gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, acc.w, acc.type, acc.normalized, 0, 0);
    };
    const walk = (i, parent) => {
      const node = G.json.nodes[i];
      const local = node.matrix ? Float64Array.from(node.matrix) : trs(node.translation || [0, 0, 0], node.rotation || [0, 0, 0, 1], node.scale || [1, 1, 1]);
      const world = mul(parent, local);
      if (node.mesh !== undefined) {
        const idx = node.extras && Number.isInteger(node.extras.index) ? node.extras.index : nameIndex.get(node.name);
        for (const prim of G.json.meshes[node.mesh].primitives) {
          const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
          const pos = accessor(prim.attributes.POSITION); attrib(0, pos);
          if (prim.attributes.NORMAL !== undefined) attrib(1, accessor(prim.attributes.NORMAL)); else gl.vertexAttrib3f(1, 0, 0, 1);
          const hasColor = prim.attributes.COLOR_0 !== undefined;
          if (hasColor) attrib(2, accessor(prim.attributes.COLOR_0)); else gl.vertexAttrib4f(2, 1, 1, 1, 1);
          const ind = accessor(prim.indices);
          const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, ind.array, gl.STATIC_DRAW);
          gl.bindVertexArray(null);
          let lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
          for (let c = 0; c < 8; c++) {
            const p = apply(world, [c & 1 ? pos.max[0] : pos.min[0], c & 2 ? pos.max[1] : pos.min[1], c & 4 ? pos.max[2] : pos.min[2]]);
            for (let k = 0; k < 3; k++) { lo[k] = Math.min(lo[k], p[k]); hi[k] = Math.max(hi[k], p[k]); }
          }
          const d = { idx, world: Float32Array.from(world), vao, count: ind.count, type: ind.type === 5125 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT, hasColor, lo, hi,
            centre: [0, 1, 2].map((k) => (lo[k] + hi[k]) / 2), radius: Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) / 2 };
          drawOf.set(idx, draws.length); draws.push(d);
        }
      }
      for (const c of node.children || []) walk(c, world);
    };
    for (const i of G.json.scenes[G.json.scene || 0].nodes) walk(i, ident());
  } catch (e) {
    fail("Не удалось показать сцену: " + e.message);
    return;
  }

  // ---------- camera ----------
  const cam = { target: [0, 0, 0], dist: 1, yaw: 0.0, pitch: 0.3, fov: (35 * Math.PI) / 180 };
  let view = ident(), proj = ident();
  const box = (list) => {
    let lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
    for (const d of list) for (let k = 0; k < 3; k++) { lo[k] = Math.min(lo[k], d.lo[k]); hi[k] = Math.max(hi[k], d.hi[k]); }
    return { c: [0, 1, 2].map((k) => (lo[k] + hi[k]) / 2), r: Math.max(Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) / 2, 1e-9) };
  };
  function frame(list) {
    if (!list.length) return;
    const b = box(list), aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);
    const half = Math.min(cam.fov, 2 * Math.atan(Math.tan(cam.fov / 2) * aspect)) / 2;
    cam.target = b.c; cam.dist = (b.r / Math.sin(half)) * 1.04; request();
  }
  const fitAll = () => { const vis = draws.filter((d) => isVisible(d.idx)); frame(vis.length ? vis : draws); };
  const fitTo = (members) => frame(members.map((f) => draws[drawOf.get(f)]).filter(Boolean));
  const focusOn = (f) => { const d = draws[drawOf.get(f)]; if (d) { cam.target = d.centre.slice(); cam.dist = Math.max(d.radius * 3.4, sceneRadius * 1e-3); request(); } };
  sceneRadius = box(draws).r;
  const eye = () => { const cp = Math.cos(cam.pitch); return [cam.target[0] + cam.dist * cp * Math.sin(cam.yaw), cam.target[1] + cam.dist * Math.sin(cam.pitch), cam.target[2] + cam.dist * cp * Math.cos(cam.yaw)]; };

  // ---------- picking ----------
  let fbo = null, fboTex = null, fboDepth = null, fboW = 0, fboH = 0;
  function ensurePickTarget() {
    if (fbo && fboW === canvas.width && fboH === canvas.height) return;
    if (fbo) { gl.deleteFramebuffer(fbo); gl.deleteTexture(fboTex); gl.deleteRenderbuffer(fboDepth); }
    fboW = canvas.width; fboH = canvas.height;
    fboTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, fboTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, fboW, fboH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    fboDepth = gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER, fboDepth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, fboW, fboH);
    fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, fboDepth);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  function pickAt(x, y) {
    ensurePickTarget();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, fboW, fboH); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.useProgram(pick.p);
    gl.uniformMatrix4fv(pick.u.uView, false, Float32Array.from(view));
    gl.uniformMatrix4fv(pick.u.uProj, false, Float32Array.from(proj));
    for (let i = 0; i < draws.length; i++) {
      const d = draws[i]; if (!isVisible(d.idx)) continue;
      const id = i + 1;
      gl.uniform3f(pick.u.uId, (id & 255) / 255, ((id >> 8) & 255) / 255, ((id >> 16) & 255) / 255);
      gl.uniformMatrix4fv(pick.u.uModel, false, d.world);
      gl.bindVertexArray(d.vao); gl.drawElements(gl.TRIANGLES, d.count, d.type, 0);
    }
    const px = new Uint8Array(4), s = canvas.width / Math.max(1, canvas.clientWidth);
    const X = Math.floor(x * s), Y = Math.floor(canvas.height - y * s - 1);
    if (X >= 0 && Y >= 0 && X < fboW && Y < fboH) gl.readPixels(X, Y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.bindVertexArray(null);
    const id = px[0] | (px[1] << 8) | (px[2] << 16);
    return id > 0 && draws[id - 1] ? draws[id - 1].idx : -1;
  }

  // ---------- labels ----------
  const labelDivs = new Map();
  for (const d of draws) { const el = document.createElement("div"); el.textContent = F[d.idx] ? F[d.idx].name : "?"; labelsEl.append(el); labelDivs.set(d.idx, el); }
  // Labels go down largest fragment first, and one that would cover a label already drawn is
  // skipped (zoom in and it appears); the selected fragment's label is always drawn.
  function placeLabels(vp) {
    const w = canvas.clientWidth, h = canvas.clientHeight, taken = [], shown = new Set();
    const order = draws
      .filter((d) => isVisible(d.idx) && (showLabels || d.idx === selected))
      .sort((a, b) => (b.idx === selected) - (a.idx === selected) || b.radius - a.radius);
    for (const d of order) {
      const c = d.centre;
      const X = vp[0] * c[0] + vp[4] * c[1] + vp[8] * c[2] + vp[12], Y = vp[1] * c[0] + vp[5] * c[1] + vp[9] * c[2] + vp[13], W = vp[3] * c[0] + vp[7] * c[1] + vp[11] * c[2] + vp[15];
      if (W <= 0) continue;
      const sx = ((X / W) * 0.5 + 0.5) * w, sy = (1 - ((Y / W) * 0.5 + 0.5)) * h;
      const el = labelDivs.get(d.idx), half = (el.textContent.length * 6.4 + 14) / 2;
      const box = [sx - half, sy - 9, sx + half, sy + 9];
      if (d.idx !== selected && taken.some((t) => box[0] < t[2] && box[2] > t[0] && box[1] < t[3] && box[3] > t[1])) continue;
      taken.push(box); shown.add(d.idx);
      el.style.left = sx + "px"; el.style.top = sy + "px"; el.classList.toggle("sel", d.idx === selected);
    }
    for (const [idx, el] of labelDivs) el.style.display = shown.has(idx) ? "block" : "none";
  }

  // ---------- render ----------
  let pending = false, wantPick = false, mouse = { x: 0, y: 0, inside: false }, drag = null;
  function request() { if (!pending) { pending = true; requestAnimationFrame(render); } }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(canvas.clientWidth * dpr)), h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  }
  function render() {
    pending = false;
    resize();
    const aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);
    view = lookAt(eye(), cam.target, [0, 1, 0]);
    proj = perspective(cam.fov, aspect, Math.max(cam.dist * 0.002, sceneRadius * 1e-5), cam.dist + sceneRadius * 6);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.105, 0.11, 0.122, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.useProgram(main.p);
    gl.uniformMatrix4fv(main.u.uView, false, Float32Array.from(view));
    gl.uniformMatrix4fv(main.u.uProj, false, Float32Array.from(proj));
    for (const d of draws) {
      if (!isVisible(d.idx)) continue;
      const fr = F[d.idx] || {};
      const base = colourMode === "fragments" ? fragColour(d.idx) : colourMode === "groups" ? (fr.group === null ? GREY : groupColour(fr.group)) : CLAY;
      gl.uniform1i(main.u.uUseVC, colourMode === "scan" && d.hasColor ? 1 : 0);
      gl.uniform3fv(main.u.uBase, base);
      gl.uniform1f(main.u.uHi, d.idx === hovered ? 1 : 0);
      gl.uniform1f(main.u.uSel, d.idx === selected ? 1 : 0);
      gl.uniformMatrix4fv(main.u.uModel, false, d.world);
      gl.bindVertexArray(d.vao); gl.drawElements(gl.TRIANGLES, d.count, d.type, 0);
    }
    gl.bindVertexArray(null);
    placeLabels(mul(proj, view));
    if (wantPick && mouse.inside && !drag) { wantPick = false; setHover(pickAt(mouse.x, mouse.y)); }
  }
  function setHover(f) {
    if (f !== hovered) { hovered = f; request(); }
    canvas.style.cursor = drag ? "" : f >= 0 ? "pointer" : "";
    if (f < 0 || !mouse.inside) { tip.style.display = "none"; return; }
    const fr = F[f], js = joinsOf.get(f) || [];
    const conf = js.filter((j) => j.band === "confirmed").length;
    const where = fr.assembled ? `группа ${fr.group} · ${(groupMembers.get(fr.group) || []).length} фр.` : "не собран";
    const joins = js.length ? ` · стыков: ${js.length}${META.tiers ? ` (подтв. ${conf})` : ""}` : "";
    tip.innerHTML = `<b>${esc(fr.name)}</b><span>${where}${joins}</span>`;
    tip.style.display = "block";
    const vw = canvas.clientWidth, vh = canvas.clientHeight, tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(mouse.x + 16, vw - tw - 6) + "px";
    tip.style.top = Math.min(mouse.y + 18, vh - th - 6) + "px";
  }

  // ---------- input ----------
  const pos = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, inside: true }; };
  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId); canvas.focus();
    drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.button === 1 || e.shiftKey, moved: 0, button: e.button };
    canvas.classList.add("drag"); tip.style.display = "none";
  });
  canvas.addEventListener("pointermove", (e) => {
    mouse = pos(e);
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
      if (drag.pan) {
        const s = (2 * cam.dist * Math.tan(cam.fov / 2)) / Math.max(1, canvas.clientHeight);
        const right = [view[0], view[4], view[8]], up = [view[1], view[5], view[9]];
        for (let k = 0; k < 3; k++) cam.target[k] += (-right[k] * dx + up[k] * dy) * s;
      } else {
        cam.yaw -= dx * 0.008; cam.pitch = Math.max(-1.55, Math.min(1.55, cam.pitch + dy * 0.008));
      }
      request();
    } else { wantPick = true; request(); }
  });
  canvas.addEventListener("pointerup", (e) => {
    canvas.classList.remove("drag");
    const click = drag && drag.moved < 5 && drag.button === 0;
    drag = null;
    if (click) select(pickAt(mouse.x, mouse.y), false);
    wantPick = true; request();
  });
  canvas.addEventListener("pointerleave", () => { mouse.inside = false; if (!drag) { setHover(-1); } });
  canvas.addEventListener("dblclick", () => { const f = pickAt(mouse.x, mouse.y); if (f >= 0) select(f, true); });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    cam.dist = Math.max(sceneRadius * 1e-3, Math.min(sceneRadius * 40, cam.dist * Math.exp(e.deltaY * 0.0012)));
    wantPick = true; request();
  }, { passive: false });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  new ResizeObserver(() => request()).observe(canvas);

  const toggleLabels = () => { showLabels = !showLabels; $("bLabels").classList.toggle("on", showLabels); request(); };
  const cycleColour = () => { colourMode = { scan: "fragments", fragments: "groups", groups: "scan" }[colourMode]; refreshSwatches(); request(); };
  $("bLabels").addEventListener("click", toggleLabels);
  $("bColour").addEventListener("click", cycleColour);
  $("bFit").addEventListener("click", fitAll);
  $("bAll").addEventListener("click", () => { for (const k of groupVisible.keys()) groupVisible.set(k, true); onlyAssembled = false; $("bAsm").classList.remove("on"); syncBoxes(); refreshVisibility(); fitAll(); });
  $("bAsm").addEventListener("click", () => { onlyAssembled = !onlyAssembled; $("bAsm").classList.toggle("on", onlyAssembled); refreshVisibility(); fitAll(); });
  window.addEventListener("keydown", (e) => {
    if (e.target === search || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === "KeyF") fitAll();
    else if (e.code === "KeyL") toggleLabels();
    else if (e.code === "KeyC") cycleColour();
    else if (e.key === "Escape") select(-1, false);
  });

  // ---------- start ----------
  refreshSwatches();
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.get("labels") === "1") toggleLabels();
  if (params.get("colour")) { colourMode = ["scan", "fragments", "groups"].includes(params.get("colour")) ? params.get("colour") : colourMode; refreshSwatches(); }
  // The first view frames the assembly; "Вписать" and "Показать всё" frame everything.
  const assembledDraws = draws.filter((d) => F[d.idx] && F[d.idx].assembled);
  frame(assembledDraws.length ? assembledDraws : draws);
  const want = params.get("fragment");
  if (want !== null && F.findIndex((f) => f.name === want) >= 0) select(F.findIndex((f) => f.name === want), true);
  // `#probe=x,y` hovers that point once the scene is drawn: how a headless check sees the tooltip.
  const probe = (params.get("probe") || "").split(",").map(Number);
  if (probe.length === 2 && probe.every(Number.isFinite)) { mouse = { x: probe[0], y: probe[1], inside: true }; wantPick = true; }
  request();
})();
</script>
</body>
</html>
