[package]
name = "sherd-cli"
description = "Command line front end of the Rust sherd-refit core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# `sherd-refit-rs` for as long as the Python package owns the name `sherd-refit`; the rename
# happens when phase 1 passes its gates (D §13.6).
[[bin]]
name = "sherd-refit-rs"
path = "src/main.rs"

# `sherd-gpu` is an optional feature, on by default (D §2). `--no-default-features` gives a
# CPU-only binary with no wgpu, no naga and no driver dependency at all — which is what a machine
# with no GPU stack, and the `check` job of D §10.5, want to be able to build.
[features]
default = ["gpu"]
gpu = ["dep:sherd-gpu"]

[dependencies]
sherd-core.workspace = true
sherd-gpu = { workspace = true, optional = true }
sherd-parity.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The determinism gate of `tests/run_cli.rs` compares `report.json` with its wall-clock timings
# taken out, which needs the file parsed rather than hashed.
serde_json.workspace = true

[lints]
workspace = true
