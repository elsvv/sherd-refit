[package]
name = "sherd-parity"
description = "Reads the Python parity fixtures and runs the Rust stages against them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "sherd_parity"

[dependencies]
sherd-core.workspace = true
# Poses and rotations of the pair stages are `nalgebra`'s, as they are in `sherd-core` (step C1).
nalgebra.workspace = true
# `npyz` reads the fixtures' .npy arrays; the reader itself lands in plan step S4.
npyz.workspace = true
# The native segmentation transfer projects every reference face onto the port's mesh (step B1).
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The `outputs` row decodes the reference's own preview PNGs to compare them pixel for pixel (D2).
image.workspace = true
# The native `candidates` row logs the wall time of every `match_pair` and every preprocessing
# (task C3's cost table); `sherd-cli` turns those lines on with `-v`.
tracing.workspace = true

[lints]
workspace = true
