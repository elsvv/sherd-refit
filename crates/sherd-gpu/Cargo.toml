[package]
name = "sherd-gpu"
description = "The wgpu executor of the Rust sherd-refit core: device, buffers, fragment slots and the WGSL kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "sherd_gpu"

[dependencies]
sherd-core.workspace = true
# Pinned exactly, and 30.0.1 rather than D §3's original "wgpu 24": experiment E7 measured this
# version on Metal (`notes/2026-09-06-e7-wgpu.md` §1), 28.0.0 needs Rust 1.92 and would not build
# here, and the API moved in six majors' worth of ways the crate below depends on.
wgpu = { workspace = true }
bytemuck.workspace = true
rayon.workspace = true
pollster.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
# `examples/repeat_probe` is task H1's reproduction, and what it has to show is the `warn!` a
# refused readback logs — the census of experiment E1. An example cannot print one without a
# subscriber.
tracing-subscriber.workspace = true

[lints]
workspace = true
