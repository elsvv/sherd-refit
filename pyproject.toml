[project]
name = "sherd-refit"
version = "0.1.0"
description = "Fracture-surface based reassembly of 3D-scanned ceramic fragments (CPU only, no GUI)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "open3d>=0.18",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sherd-refit = "sherd_refit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sherd_refit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests"]
